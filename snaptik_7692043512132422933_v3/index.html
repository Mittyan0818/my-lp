          <span class="name" id="name"></span>
          <span class="live-row">
            <span class="live">LIVE</span>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>

          <svg class="heart" id="heart-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden><path d="M12 21s-7.3-4.6-10-9.3C.6 9 1.6 5.4 4.8 4.6 7 4 9 5 10 6.6c.4.7.6 1 2 1s1.6-.3 2-1C15 5 17 4 19.2 4.6c3.2.8 4.2 4.4 2.8 7.1C19.3 16.4 12 21 12 21z"/></svg>
          <span id="likes">0</span>

  </div>

  <div class="like-toast" id="like-toast" hidden>ログインすることでいいねが反映されます</div>

  <button class="unblur" id="unblur" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>

  <button class="swipe-hint" id="swipe-hint" type="button" aria-label="次の動画へ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden><path d="M6 14l6-6 6 6"/><path d="M6 20l6-6 6 6" opacity=".55"/></svg>
    <span>スワイプ</span>

  <section class="cta" id="cta">
    <h1 id="heading"></h1>
    <p id="desc"></p>

    <a class="cta-more" id="cta-more" rel="nofollow sponsored noopener" target="_blank"></a>
  </section>

  <div class="comments" id="comments" hidden></div>
  <form class="cbar" id="cbar" autocomplete="off" hidden>
    <input type="text" id="cbar-input" maxlength="80" enterkeyhint="send" placeholder="コメントする…" aria-label="コメント">
    <button type="submit">送信</button>
  </form>
  <div class="reg-pop" id="reg-pop" hidden>
    <div class="reg-box" role="dialog" aria-modal="true" aria-labelledby="reg-pop-title">
      <button class="reg-close" id="reg-close" type="button" aria-label="閉じる">✕</button>
      <h3 id="reg-pop-title">コメントするには登録が必要です</h3>
      <p id="reg-pop-desc"></p>
      <div class="reg-mine" id="reg-mine" hidden></div>
      <a class="reg-go" id="reg-go" rel="nofollow sponsored noopener" target="_blank">登録してコメントする</a>
    </div>
  </div>
  <div class="footer" id="footer"></div>
</main>

<!-- PC表示 -->
<div id="pc" hidden>
  <div class="pc-box">
    <div class="pc-phone"><canvas id="pc-canvas"></canvas></div>
    <div class="pc-text">
      <h2>このページはスマートフォン専用です</h2>
      <p>スマホのカメラでQRコードを読み取ってアクセスしてください。</p>
      <div id="qr"></div>
      <div class="pc-url" id="pc-url"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var cfg = JSON.parse($('lp-config').textContent);

  // ?view=sp / ?view=pc で強制切替（確認用）
  var forced = params.get('view');
  var isPc = forced ? forced === 'pc' : !isMobileDevice();

  // スマホ・タブレットかどうかを端末情報で判定する。
  // （タッチ対応のWindowsノートなどもPC扱いにするため、画面幅やタッチ有無では判定しない）
  function isMobileDevice() {
    var uad = navigator.userAgentData;
    if (uad && typeof uad.mobile === 'boolean' && uad.mobile) return true;
    var ua = navigator.userAgent;
    if (/iPhone|iPod|Android.+Mobile|Windows Phone|BlackBerry|Opera Mini|IEMobile/i.test(ua)) return true;
    if (/iPad|Android(?!.*Mobile)|Silk|Kindle/i.test(ua)) return true; // タブレットもスマホ表示
    // iPadOS は Mac と同じ UA を名乗るので、タッチ点数で見分ける
    return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  }

  function store(key, val) {
    try { if (val === undefined) return sessionStorage.getItem(key); sessionStorage.setItem(key, val); } catch (e) { return null; }
  }
  function blurPx(c) { return Math.round((Number(c.blurStrength) || 6) * 3.5) + 'px'; }

  // どの動画を使うか。ぼかし済み動画があればそれを使い、なければ元動画をブラウザでぼかす。
  function pickVideo(c, wantBlur) {
    if (wantBlur && c.videoBlur) return { key: 'blur:' + c.videoBlur, src: c.videoBlur, cssBlur: null };
    return { key: 'orig', src: c.video, cssBlur: wantBlur ? blurPx(c) : null };
  }

  document.addEventListener('contextmenu', function (e) {
    if (e.target.tagName === 'VIDEO' || e.target.tagName === 'CANVAS') e.preventDefault();
  });

  // ================= PC =================
  if (isPc) {
    $('pc').hidden = false;
    $('sp').remove();
    params.delete('view');
    var q = params.toString();
    var url = cfg.pageUrl || (location.origin + location.pathname + (q ? '?' + q : ''));
    $('pc-url').textContent = url;
    if (window.QRCode) new QRCode($('qr'), { text: url, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.M });

    var canvas = $('pc-canvas'), ctx = canvas.getContext('2d');
    var pv = document.createElement('video'); // DOM には追加しない
    pv.muted = true; pv.loop = true; pv.playsInline = true; pv.autoplay = true;
    pv.disablePictureInPicture = true;
    var pcKey = null;

    var applyPc = function (c) {
      var v = pickVideo(c, true);
      if (v.key !== pcKey) { pcKey = v.key; pv.src = v.src; pv.play().catch(function () {}); }
      canvas.style.filter = v.cssBlur ? 'blur(' + v.cssBlur + ')' : '';
      canvas.classList.toggle('css-blur', !!v.cssBlur);
    };
    var draw = function () {
      var w = canvas.clientWidth, h = canvas.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
      if (pv.videoWidth) {
        var s = Math.max(canvas.width / pv.videoWidth, canvas.height / pv.videoHeight);
        var dw = pv.videoWidth * s, dh = pv.videoHeight * s;
        ctx.drawImage(pv, (canvas.width - dw) / 2, (canvas.height - dh) / 2, dw, dh);
      }
      requestAnimationFrame(draw);
    };
    applyPc(cfg);
    requestAnimationFrame(draw);
    listenPreview(applyPc);
    return;
  }

  // ================= スマホ =================
  $('sp').hidden = false;
  var video = $('sp-video');
  var started = false, muted = true, activeVideo = video, videoEls = [video];
  var mediaKey = '', feedObs = null;
  var curCfg = cfg, stats = [], activeIdx = 0, cmtNext = null;
  var ctaEl = $('cta'); // 誘導ダイアログ（DOMから外れても見失わないよう参照を固定）
  // 誘導の表示／非表示。ぼかし中の「ぼかしを外して見る」ボタンは、誘導が出ていない時だけ出す
  var ctaTimer = null;
  function showCta() { clearTimeout(ctaTimer); ctaEl.classList.add('show'); updateUnblur(); fitComments(); }
  // sec 秒後に誘導を出す（「いいえ」で閉じても、また出す）
  function scheduleCta(sec) { clearTimeout(ctaTimer); ctaTimer = setTimeout(showCta, Math.max(0, Number(sec) || 0) * 1000); }
  function repeatSec() { var n = Number(curCfg.ctaRepeatSec); return Number.isFinite(n) && n > 0 ? n : 10; }
  function hideCta() { ctaEl.classList.remove('show'); updateUnblur(); fitComments(); }
  // 誘導が出ている間は、コメント欄の上端を誘導の下端より下に収める（被らないように）
  function fitComments() {
    var box = $('comments');
    if (!ctaEl.classList.contains('show')) { box.style.maxHeight = ''; return; }
    var room = box.getBoundingClientRect().bottom - ctaEl.getBoundingClientRect().bottom - 16;
    box.style.maxHeight = Math.max(56, Math.floor(room)) + 'px';
  }
  window.addEventListener('resize', fitComments);
  function updateUnblur() {
    var on = !!curCfg.blur && !ctaEl.classList.contains('show') && !$('sp').classList.contains('on-cta');
    $('unblur').hidden = !on;
  }
  $('unblur').addEventListener('click', showCta);
  function feedMode() { return $('sp').classList.contains('feed-mode'); }

  function render(c, live) {
    curCfg = c;
    setupMedia(c);

    var tags = $('tags'); tags.textContent = '';
    (c.tags || []).forEach(function (t) {
      var s = document.createElement('span'); s.className = 'tag'; s.textContent = t; tags.appendChild(s);
    });
    $('heading').textContent = c.heading || '';
    $('desc').textContent = c.description || '';
    $('desc').style.display = c.description ? '' : 'none';
    var url = c.ctaUrl || '#';
    $('cta-yes').textContent = c.yesText || 'はい';
    $('cta-yes').href = url;
    $('cta-no').textContent = c.noText || 'いいえ';
    $('cta-more').textContent = c.ctaText || '';
    $('cta-more').href = url;
    $('cta-more').style.display = c.ctaText ? '' : 'none';
    // 右上の登録ボタン：専用リンクがあればそれ、空欄なら誘導のリンク先
    $('reg').hidden = c.regOn === false;
    $('reg').textContent = c.regText || '登録する';
    $('reg').href = c.regUrl || url;
    // コメント入力欄：送信すると登録の案内（リンク先は登録ボタンと同じ）
    var cbarOn = c.cbarOn !== false;
    $('cbar').hidden = !cbarOn;
    $('sp').classList.toggle('has-cbar', cbarOn);
    $('cbar-input').placeholder = c.cbarPlaceholder || 'コメントする…';
    $('reg-pop-title').textContent = c.cbarTitle || 'コメントするには登録が必要です';
    $('reg-pop-desc').textContent = c.cbarDesc || '';
    $('reg-pop-desc').hidden = !c.cbarDesc;
    $('reg-go').textContent = c.cbarGo || '登録してコメントする';
    $('reg-go').href = c.regUrl || url;
    $('footer').textContent = c.footerNote || '';
    applyComments(c);
    paintStats(); // 名前・いいね数・視聴者数（動画ごと）
    $('unblur-text').textContent = c.unblurText || 'ぼかしを外して見る';
    if (live && started) showCta(); else updateUnblur();
    fitComments();
  }

  // ---------- 動画ごとの名前・いいね数・視聴者数 ----------
  function rndViewers() { return Math.floor(Math.random() * 7000) + 1000; } // 1,000〜7,999
  function vName(i) {
    var clip = curCfg.clips && curCfg.clips[i];
    return (clip && clip.name) || curCfg.title || '';
  }
  function vLikes(i) {
    var base = Number(curCfg.likes != null ? curCfg.likes : 1900);
    var f = [1, 1.18, 0.85, 1.33, 0.72, 1.07, 0.92, 1.25, 0.8][i % 9]; // 動画ごとに固定でずらす
    return Math.max(1, Math.round(base * f / 10) * 10);
  }
  // アイコン未設定のときの既定アイコン（人型シルエット＋ランダムな背景色）
  function hashNum(s) { s = String(s); var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
  function defaultAvatar(seed) {
    var hue = hashNum(seed) % 360;
    var bg = 'hsl(' + hue + ',42%,52%)';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<rect width="100" height="100" fill="' + bg + '"/>' +
      '<circle cx="50" cy="39" r="16" fill="#d9d9df"/>' +
      '<path d="M24 84c0-15 12-25 26-25s26 10 26 25z" fill="#d9d9df"/>' +
      '</svg>';
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }
  function vAvatar(i) {
    var clip = curCfg.clips && curCfg.clips[i];
    if (clip && clip.avatar) return clip.avatar;
    if (!curCfg.clips && curCfg.avatar) return curCfg.avatar; // 単動画の保険
    return defaultAvatar(vName(i) || ('v' + i));
  }
  function activeName() { return vName(activeIdx); }
  function paintStats() {
    var st = stats[activeIdx]; if (!st) return;
    $('name').textContent = vName(activeIdx);
    $('likes').textContent = fmtK(vLikes(activeIdx));
    $('viewers').textContent = fmtK(st.viewers);
    $('avatar').hidden = false;
    $('avatar').src = vAvatar(activeIdx);
  }
  function setActive(i) {
    if (!stats[i]) return;
    var changed = i !== activeIdx;
    activeIdx = i;
    paintStats();
    if (changed) reseedComments(); // スクロール先の名前でコメントを入れ替える
  }
  function reseedComments() {
    var box = $('comments');
    if (!cmtNext || box.hidden) return;
    box.textContent = '';
    for (var i = 0; i < 4; i++) cmtNext();
  }

  // ---------- 動画（単動画／複数動画の縦スクロール） ----------
  function clipSrc(c, clip, wantBlur) {
    if (wantBlur && clip.videoBlur) return { src: clip.videoBlur, cssBlur: null };
    return { src: clip.video, cssBlur: wantBlur ? blurPx(c) : null };
  }
  function tuneVideo(v) {
    v.muted = muted; v.loop = true; v.playsInline = true; v.setAttribute('playsinline', '');
    v.preload = 'auto'; v.disablePictureInPicture = true;
    v.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');
  }
  // clips の本数・ぼかしが変わったときだけ作り直す（テキスト編集の度には作り直さない）
  function setupMedia(c) {
    var clips = (c.clips && c.clips.length) ? c.clips : [{ video: c.video, videoBlur: c.videoBlur }];
    var key = JSON.stringify([clips.length, !!c.blur, c.blurStrength]);
    if (key === mediaKey) return;
    mediaKey = key;
    lastSlideIdx = -1;
    var feed = $('feed'), media = $('media');
    // 誘導ダイアログがフィード内にあると innerHTML='' で一緒に消えてしまうので、先に本体へ退避する
    if (ctaEl.parentNode !== $('sp')) $('sp').insertBefore(ctaEl, $('comments'));
    feed.innerHTML = '';

    stats = clips.map(function () { return { viewers: rndViewers() }; });
    activeIdx = 0;

    // 縦スクロールフィード（動画が1本でも、下にスクロールすると誘導スライドへ進める）
    $('sp').classList.add('feed-mode');
    media.hidden = true; feed.hidden = false;
    videoEls = [];
    clips.forEach(function (clip, i) {
      var slide = document.createElement('div'); slide.className = 'slide'; slide.dataset.i = i;
      var sv = clipSrc(c, clip, !!c.blur);
      var vid = document.createElement('video'); tuneVideo(vid);
      vid.src = sv.src || '';
      if (sv.cssBlur) { vid.style.filter = 'blur(' + sv.cssBlur + ')'; vid.className = 'css-blur'; }
      slide.appendChild(vid); feed.appendChild(slide); videoEls.push(vid);
    });
    activeVideo = videoEls[0];
    // 最後に暗い「誘導だけ」のスライド（ここまで来ると誘導を必ず表示）
    var ctaSlide = document.createElement('div'); ctaSlide.className = 'slide cta-slide';
    feed.appendChild(ctaSlide);
    // スクロール位置から「今表示中のスライド」を判定（IntersectionObserver は環境により発火しないため）
    feedScrollUpdate();
    activeVideo.play().catch(function () {});
  }

  // フィードのスクロールで、表示中の動画・名前・数値・コメントを切り替える
  var lastSlideIdx = -1;
  function feedScrollUpdate() {
    var feed = $('feed'); if (feed.hidden) return;
    var h = feed.clientHeight; if (!h) return;
    var idx = Math.round(feed.scrollTop / h);
    if (idx === lastSlideIdx) return; // 同じスライドなら何もしない
    lastSlideIdx = idx;
    var slide = feed.children[idx]; if (!slide) return;
    var isCta = slide.classList.contains('cta-slide');
    $('sp').classList.toggle('on-cta', isCta);
    if (isCta) showCta(); else updateUnblur();
    var vid = slide.querySelector('video');
    videoEls.forEach(function (x) { if (x !== vid) x.pause(); });
    if (vid) { activeVideo = vid; vid.muted = muted; vid.play().catch(function () {}); }
    if (!isCta) setActive(Number(slide.dataset.i));
  }
  $('feed').addEventListener('scroll', feedScrollUpdate, { passive: true });
  // 「スワイプ」案内を押したら次のスライドへ
  $('swipe-hint').addEventListener('click', function () {
    var feed = $('feed'), h = feed.clientHeight; if (!h) return;
    var next = feed.children[Math.round(feed.scrollTop / h) + 1];
    if (next) next.scrollIntoView({ behavior: 'smooth' });
  });

  // 「いいえ」：誘導を閉じる。フィードの最後（誘導だけのスライド）にいる時は直前の動画へ戻す
  $('cta-no').addEventListener('click', function () {
    var onEnd = feedMode() && $('sp').classList.contains('on-cta');
    scheduleCta(repeatSec()); // 閉じても、しばらくしたらまた出す
    if (onEnd) {
      var s = $('feed').children;
      $('sp').classList.remove('on-cta');
      lastSlideIdx = -1; // 次のスクロールで必ず判定し直す（再び最後まで来たら誘導を出す）
      if (s.length >= 2) s[s.length - 2].scrollIntoView({ behavior: 'smooth' });
    }
    hideCta();
  });

  // コメントを送信 → 「登録が必要です」の案内を出す（実際には投稿しない）
  $('cbar').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('cbar-input').value.trim();
    $('cbar-input').blur();
    $('reg-mine').textContent = v; $('reg-mine').hidden = !v;
    $('reg-pop').hidden = false;
  });
  function closeRegPop() { $('reg-pop').hidden = true; }
  $('reg-close').addEventListener('click', closeRegPop);
  $('reg-pop').addEventListener('click', function (e) { if (e.target === this) closeRegPop(); });
  $('reg-go').addEventListener('click', closeRegPop);

  // 数値の表示（1000以上は 1.0k 形式）
  function fmtK(n) { n = Math.round(Number(n) || 0); return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }

  // ハートを押す → 一瞬ハートが埋まり、ログイン誘導のメッセージを出す（カウントは増やさない＝固定）
  var likeToastTimer = null, heartTimer = null;
  $('likes-btn').addEventListener('click', function () {
    var ico = $('heart-ico'), toast = $('like-toast');
    ico.classList.add('on');
    clearTimeout(heartTimer); heartTimer = setTimeout(function () { ico.classList.remove('on'); }, 650);
    toast.hidden = false;
    clearTimeout(likeToastTimer); likeToastTimer = setTimeout(function () { toast.hidden = true; }, 1800);
  });

  // ---------- LIVEコメント ----------
  // 設定の comments 配列からユーザー名と本文を別プールに分けて、ランダムに組み合わせて流す。
  // 同じユーザー名や同じ本文が続けて出ないようシャッフルし、本文内の {name} は発言者名に置き換える。
  var cmtTimer = null, cmtKey = '';
  function applyComments(c) {
    var box = $('comments');
    var entries = (c.comments || [])
      .map(function (x) { return typeof x === 'string' ? { text: x } : x; })
      .filter(function (x) { return x && (x.text || x.user); });
    var on = !!c.commentsOn && entries.length > 0;
    box.hidden = !on;
    if (!on) {
      if (cmtTimer) { clearInterval(cmtTimer); cmtTimer = null; }
      cmtKey = ''; box.textContent = '';
      return;
    }
    var key = JSON.stringify([entries, c.commentsInterval]);
    if (key === cmtKey) return;
    cmtKey = key;
    box.textContent = '';
    if (cmtTimer) clearInterval(cmtTimer);

    // 名前と本文を別プールに。重複は除く
    var users = uniq(entries.map(function (x) { return x.user; }).filter(Boolean));
    var texts = []; var seenText = {};
    entries.forEach(function (x) {
      if (!x.text) return;
      var k = x.text + '\x00' + (x.highlight ? '1' : '0');
      if (seenText[k]) return; seenText[k] = 1;
      texts.push({ text: x.text, highlight: !!x.highlight });
    });
    if (!texts.length) return;
    if (!users.length) users = ['ゲスト']; // 名前がゼロなら最低1つ入れる

    var userQ = [], textQ = [];
    var lastUser = '', lastText = '';
    function refillUsers() { userQ = shuffle(users.slice()); }
    function refillTexts() { textQ = shuffle(texts.slice()); }

    function pickUser() {
      if (!userQ.length) refillUsers();
      var u = userQ.shift();
      if (users.length > 1 && u === lastUser) { userQ.push(u); u = userQ.shift(); }
      return (lastUser = u);
    }
    function pickText() {
      if (!textQ.length) refillTexts();
      var t = textQ.shift();
      if (texts.length > 1 && t.text === lastText) { textQ.push(t); t = textQ.shift(); }
      lastText = t.text; return t;
    }

    function next() {
      var user = pickUser(), t = pickText();
      var body = t.text.replace(/\{name\}/g, activeName()); // {name} は今映っている動画の名前に（スクロールで切替）
      var el = document.createElement('div');
      el.className = 'cmt' + (t.highlight ? ' hi' : '');
      var u = document.createElement('span'); u.className = 'u'; u.textContent = user;
      el.appendChild(u);
      el.appendChild(document.createTextNode(body));
      box.appendChild(el);
      while (box.children.length > 7) box.removeChild(box.firstChild);
    }
    cmtNext = next; // スクロールで名前を入れ替えて再生成できるように

    for (var i = 0; i < Math.min(4, texts.length); i++) next();
    var ms = Math.max(600, Number(c.commentsInterval || 2.2) * 1000);
    cmtTimer = setInterval(next, ms);
  }
  function uniq(arr) { var s = {}, r = []; arr.forEach(function (x) { if (!s[x]) { s[x] = 1; r.push(x); } }); return r; }
  function shuffle(arr) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }

  $('sound').addEventListener('click', function () {
    muted = !muted;
    videoEls.forEach(function (v) { v.muted = muted; });
    if (!muted && activeVideo) activeVideo.play().catch(function () {});
    this.textContent = muted ? '🔇' : '🔊';
    this.setAttribute('aria-label', muted ? '音声をオンにする' : '音声をオフにする');
  });

  // ---------- 視聴者数（動画ごと・テスト用のダミー表示） ----------
  // 動画ごとに別の数値を持ち、3秒ごとに ±5 で変動。上限1万人、1000以上は 1.0k 形式。
  setInterval(function () {
    stats.forEach(function (st) {
      st.viewers = Math.max(10, Math.min(10000, st.viewers + (Math.floor(Math.random() * 11) - 5)));
    });
    paintStats();
  }, 3000);

  function start() {
    started = true;
    (activeVideo || video).play().catch(function () {});
    // 数秒後に動画の上へ誘導を出す
    scheduleCta(cfg.ctaDelaySec);
  }

  render(cfg);
  listenPreview(function (c) { render(c, true); });

  if (cfg.ageGate && store('age-ok') !== '1') {
    $('age').hidden = false;
    $('age-yes').addEventListener('click', function () {
      store('age-ok', '1');
      $('age').hidden = true;
      start();
    });
  } else {
    start();
  }

  // 管理画面のプレビューから、保存前の設定を受け取って即反映する（同じオリジンからのみ）
  function listenPreview(fn) {
    if (window.parent === window) return;
    window.addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== 'lp-preview') return;
      fn(e.data.cfg);
    });
  }
})();
</script>
